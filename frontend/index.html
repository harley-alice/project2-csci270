<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freshy 🌸 | Cutest Fridge Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #fff5f7;
        color: #4a2835;
        -webkit-font-smoothing: antialiased;
        background-image: radial-gradient(#fecdd3 1px, transparent 1px), radial-gradient(#fecdd3 1px, #fff5f7 1px);
        background-size: 40px 40px;
        background-position: 0 0, 20px 20px;
      }
      button, input, select {
        font-family: inherit;
      }
      h1, h2, h3, h4, .brand-font {
        font-family: 'Fredoka', 'Outfit', sans-serif;
      }
      /* Custom cute pink scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf2f8;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #f472b6;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ec4899;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
