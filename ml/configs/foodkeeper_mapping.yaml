
# Maps normalized computer-vision classes to USDA FoodKeeper products.
#
# Product IDs are candidate matches, not automatic equivalences.
# Classes with multiple product types require user confirmation.
#
# An empty product_ids list and empty search_terms list mean that
# no sufficiently specific FoodKeeper match has been approved.
#
# Do not use unrelated products to fill missing mappings.

tiers:

  # --------------------------------------------------
  # Tier 1: High-priority refrigerated foods
  # --------------------------------------------------

  tier_1:

    beef:
      product_ids: [34, 35, 36, 37, 38, 39, 40, 41, 42]
      search_terms: []
      requires_user_detail: true
      detail_prompt: "Which beef product is this? Confirm the cut and whether it is whole-muscle beef or another preparation."

    ground_beef:
      product_ids: [43]
      search_terms: []
      requires_user_detail: false

    chicken:
      product_ids: [113, 116, 117, 118]
      search_terms: []
      requires_user_detail: true
      detail_prompt: "Is this a whole chicken, bone-in breast, boneless breast, or chicken legs/thighs?"

    shrimp:
      product_ids: [151, 325]
      search_terms: []
      requires_user_detail: true
      detail_prompt: "Is the shrimp raw or cooked, fresh or previously frozen, and in what condition is it being stored? Confirm the matching FoodKeeper product before using its guidance."


